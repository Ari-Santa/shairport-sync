[package]
name = "shairport-sync-gui"
version = "1.0.0"
description = "AirPlay Receiver, a now-playing window for Shairport Sync"
license = "MIT"
edition = "2021"
# Debian 13's Rust. With resolver 3, Cargo.lock holds versions of the
# dependencies that build with it; regenerate the lock file with that cargo.
rust-version = "1.85"
resolver = "3"
publish = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
cxx-qt-build = "0.10"
