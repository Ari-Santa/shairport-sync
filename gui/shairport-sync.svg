<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="body" x1="0" y1="5" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a7480"/>
      <stop offset="1" stop-color="#363f49"/>
    </linearGradient>
    <radialGradient id="cone" cx="20" cy="29" r="8" fx="18.5" fy="27.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f5863"/>
      <stop offset="1" stop-color="#1b2026"/>
    </radialGradient>
    <radialGradient id="tweeter" cx="20" cy="13" r="3.4" fx="19" fy="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa5b1"/>
      <stop offset="1" stop-color="#2a323a"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d99f3"/>
    </linearGradient>
    <linearGradient id="waves" x1="0" y1="11" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d99f3"/>
    </linearGradient>
    <linearGradient id="wooferShadow" x1="20" y1="29" x2="33" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18222a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#18222a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tweeterShadow" x1="20" y1="13" x2="31" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18222a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#18222a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cabinet, with a darker 1px bottom edge for thickness -->
  <rect x="7" y="5" width="26" height="38" rx="3" fill="#232a31"/>
  <rect x="7" y="5" width="26" height="37" rx="3" fill="url(#body)"/>
  <rect x="9" y="5.6" width="22" height="0.8" rx="0.4" fill="#fff" opacity="0.2"/>

  <!-- 45 degree long shadows, pre-clipped to the cabinet (QtSvg has no clip-path) -->
  <path fill="url(#tweeterShadow)" d="M23.25 9.75 L33 19.5 L33 32.5 L16.75 16.25 Z"/>
  <path fill="url(#wooferShadow)" d="M27.21 21.79 L33 27.58 L33 39 A3 3 0 0 1 30 42 L18.58 42 L12.79 36.21 Z"/>

  <!-- tweeter -->
  <circle cx="20" cy="13" r="4.6" fill="#1b2026"/>
  <circle cx="20" cy="13" r="3.4" fill="url(#tweeter)"/>

  <!-- woofer: surround, cone, blue dust cap -->
  <circle cx="20" cy="29" r="10.2" fill="#1b2026"/>
  <circle cx="20" cy="29" r="9.1" fill="#434c57"/>
  <circle cx="20" cy="29" r="8" fill="url(#cone)"/>
  <circle cx="20" cy="29" r="3.3" fill="url(#blue)"/>
  <circle cx="19.2" cy="28" r="1" fill="#fff" opacity="0.35"/>

  <!-- sound waves -->
  <g fill="none" stroke="url(#waves)" stroke-width="2.5" stroke-linecap="round">
    <path d="M36.04 18.04 A8 8 0 0 1 36.04 29.96"/>
    <path d="M39.57 14.51 A13 13 0 0 1 39.57 33.49"/>
  </g>
</svg>
